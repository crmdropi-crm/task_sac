# Ejemplo de configuración de Nginx como proxy inverso con HTTPS para task_sac.
# Útil si despliegas en un servidor propio SIN Easypanel/Traefik.
# (En Easypanel el HTTPS y el proxy los maneja Traefik automáticamente.)
#
# Requisitos: certificado TLS (p. ej. con certbot/Let's Encrypt).
#   sudo certbot --nginx -d tareas.midominio.com

# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name tareas.midominio.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tareas.midominio.com;

    ssl_certificate     /etc/letsencrypt/live/tareas.midominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tareas.midominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # La app Node escucha en el puerto 3000 (ajusta si usas otro)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para Server-Sent Events (tiempo real): sin buffering y
        # conexiones de larga duración.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
